name: rift-e2e

# THE RIFT end to end: a real Minecraft 1.21.1 client (with the Fabric mod) and the real
# UNRENDERED (with glowstone-rift.dll) run together under Xvfb and play against each other.
# Screenshots from both land in the artifact and, downscaled, in this log.
on:
  push:
    branches: [testing]
    paths:
      - 'PortalMods/**'
      - '.github/workflows/rift-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 python3-pil
      - name: Build Minecraft side
        working-directory: PortalMods/fabric
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Build UNRENDERED and its mod
        run: |
          dotnet build -c Release
          dotnet build PortalMods/unrendered -c Release
          mkdir -p bin/Release/net10.0/Mods
          cp PortalMods/unrendered/out/glowstone-rift.dll bin/Release/net10.0/Mods/
      - name: Play both
        run: PortalMods/e2e/run.sh "$RUNNER_TEMP/e2e"
      - name: Show screenshots
        if: always()
        run: python3 PortalMods/e2e/show.py "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-e2e
          path: ${{ runner.temp }}/e2e
