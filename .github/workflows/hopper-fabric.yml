name: hopper-fabric

# Builds the Dimension Hopper (PortalMods/hopper/fabric) into a Fabric 1.21.1 jar.
on:
  push:
    branches: [testing]
    paths:
      - 'PortalMods/hopper/**'
      - '.github/workflows/hopper-fabric.yml'
  pull_request:
    paths:
      - 'PortalMods/hopper/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortalMods/hopper/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dimension-hopper-fabric-1.21.1
          path: PortalMods/hopper/fabric/build/libs/*.jar
