name: rift-fabric

# Builds the Minecraft side of THE RIFT (PortalMods/fabric) into a Fabric 1.21.1 jar.
on:
  push:
    branches: [testing]
    paths:
      - 'PortalMods/fabric/**'
      - '.github/workflows/rift-fabric.yml'
  pull_request:
    paths:
      - 'PortalMods/fabric/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortalMods/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unrendered_portal-fabric-1.21.1
          path: PortalMods/fabric/build/libs/*.jar
