name: rift-fabric

# Builds the Minecraft side of THE RIFT (PortalMods/fabric) into a Fabric 1.21.1 jar.
on:
  push:
    branches: [testing]
    paths:
      - 'PortalMods/fabric/**'
      - '.github/workflows/rift-fabric.yml'
  pull_request:
    paths:
      - 'PortalMods/fabric/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortalMods/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Smoke test on a dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\n' > run/server.properties
          nohup ./gradlew runServer --no-daemon --console=plain > run/server.log 2>&1 &
          echo $! > run/gradle.pid
          set +e
          python3 tools/smoke.py run/server.log
          status=$?
          pkill -f 'net.fabricmc.devlaunchinjector' || true
          pkill -f 'runServer' || true
          kill "$(cat run/gradle.pid)" 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unrendered_portal-fabric-1.21.1
          path: PortalMods/fabric/build/libs/*.jar
